<head class="insert" th:insert="@{Admin/Components/empty_header}" />

<!--Send Notification To User Start-->
<div class="content-wrapper">
    <div class="row">
        <div class="col-md-12 grid-margin stretch-card">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title" style="text-align: center;" th:text="#{label.addnewuser}"/>
                    <p class="card-description" style="text-align: center;" th:text="#{label.please_fill_under_data}"/>
                    <form class="forms-sample" th:action="@{/Admin/Panel/UserManager/User/New/Done}" method="post" enctype="multipart/form-data">
                        <div class="form-group">
                            <label for="exampleInputUsername1" th:text="#{label.username}"/>
                            <input type="text" class="form-control" id="exampleInputUsername1" th:placeholder="#{label.username}" name="username" required>
                        </div>
                        <div class="form-group">
                            <label for="exampleInputUsername1" th:text="#{label.name}"/>
                            <input type="text" class="form-control" id="exampleInputUsername1" th:placeholder="#{label.name}" name="name" required>
                        </div>
                        <div class="form-group">
                            <label for="exampleInputUsername1" th:text="#{label.family}"/>
                            <input type="text" class="form-control" id="exampleInputUsername1" th:placeholder="#{label.family}" name="family" required>
                        </div>
                        <div class="form-group">
                            <label for="exampleInputPassword1" th:text="#{label.newpassword}"/>
                            <input type="password" class="form-control" id="exampleInputPassword1" th:placeholder="#{label.newpassword}" name="password" required>
                        </div>
                        <div class="form-group">
                            <label for="exampleInputPassword1" th:text="#{label.email}"/>
                            <input type="email" class="form-control" id="exampleInputPassword1" th:placeholder="#{label.email}" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="exampleInputPassword1" th:text="#{label.phone}"/>
                            <input type="text" class="form-control" id="exampleInputPassword1" th:placeholder="#{label.phone}" name="phone" required>
                        </div>
                        <div class="form-group">
                            <label for="exampleInputPassword1" th:text="#{label.address}"/>
                            <input type="text" class="form-control" id="exampleInputPassword1" th:address="#{label.address}" name="address" required>
                        </div>
                        <div class="form-group">
                            <label for="exampleInputUsername1" th:text="#{label.city}"/>
                            <select class="form-control" id="exampleInputUsername1" name="city">
                                <option th:each="city : ${Cites}" th:text="${city.getName()}" th:value="${city.getId()}"/>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="exampleInputPassword1" th:text="#{label.bio}"/>
                            <textarea style="height: 150px;" class="form-control" id="exampleInputPassword1" th:placeholder="#{label.bio}" name="bio"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="exampleInputPassword1" th:text="#{label.newprofileimage}"/>
                            <input type="file" class="form-control" id="exampleInputPassword1" name="profile_image">
                        </div>
                        <div class="form-group">
                            <label for="exampleInputUsername1" th:text="#{label.usertype}"/>
                            <select class="form-control" id="exampleInputUsername1" name="user_type">
                                <option th:each="user_type : ${user_types}" th:text="${user_type.getTitle()}" th:value="${user_type.getTitle()}"/>
                            </select>
                        </div>

                        <br>
                        <button style="width: 100%;" type="submit" class="btn btn-gradient-primary mr-2" th:text="#{label.done}"/>
                    </form>
                </div>
            </div>
        </div>
    </div>
<!--Send Notification To User End-->

<hdr class="insert" th:insert="@{Admin/Components/empty_footer}" />
