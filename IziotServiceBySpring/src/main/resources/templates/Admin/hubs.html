<head class="insert" th:insert="@{Admin/Components/panel_header}" />

<!-- partial -->
<div class="main-panel">
  <div class="content-wrapper">

    <div class="page-header">
      <h3 class="page-title">
                <span class="page-title-icon bg-gradient-primary text-white mr-2">
                  <i class="mdi mdi-camera-gopro"></i>
                </span></span><span th:text="#{label.allhubs}"/>
      </h3>
    </div>

    <div class="row">


      <!--Content Start-->
      <div class="col-lg-12 grid-margin stretch-card">
        <div class="card">
          <div class="card-body">
            <h4 class="card-title" th:text="#{label.allhubs}"/>
            <table th:if="${hubs.size>0}" class="table">
              <thead>
              <tr>
                <th th:text="#{label.title}"/>
                <th style="text-align: center;" th:text="#{label.serialnumber}"/>
                <th th:text="#{label.iot_type}"/>
<!--                <th th:text="#{label.iot_model}"/>-->
                <th th:text="#{label.adminnumber}"/>
                <th style="text-align: center;" th:text="#{label.status}"/>
                <th style="text-align: center;" th:text="#{label.copy}"/>
                <th style="text-align: center;" th:text="#{label.gettimelaps}"/>
                <th style="text-align: center;" th:text="#{label.getvideo}"/>
                <th style="text-align: center;" th:text="#{label.edit}"/>
              </tr>
              </thead>
              <tbody>

              <tr th:each="hub : ${hubs}">
                <td th:text="${hub.getTitle()}"/>
                <td style="text-align: center;"><a target="_blank" th:href="@{/Hub/}+${hub.getSerial_number()}" th:text="${hub.getSerial_number()}"></a></td>
                <td th:text="${hub.getIot_type()}"/>
<!--                <td th:text="${hub.getIot_model()}"/>-->
                <td th:text="${hub.getAdmin_mobile()}"/>

                <td style="text-align: center;" th:if="${hub.getStatus().equals('Enable')}">
                  <i class="mdi mdi-check-circle" style="font-size: 20px;color: #77bc23;"></i>
                </td>
                <td style="text-align: center;" th:if="${hub.getStatus().equals('Poor')}">
                  <i class="mdi mdi-chart-donut" style="font-size: 20px;color: #EF6C00;"></i>
                </td>
                <td style="text-align: center;" th:if="${!hub.getStatus().equals('Enable') and !hub.getStatus().equals('Poor')}">
                  <i class="mdi mdi-close-circle" style="font-size: 20px;color: #FF0000;"></i>
                </td>

                <td th:if='${hub.getIot_model().toUpperCase().contains("PROTOCOL")}' style="text-align: center;"><i th:onclick="GetCopyToClipBoard(btoa('[[${IOTToken.GetToken(hub)}]]'))"><i class="mdi mdi-content-copy" style="font-size: 20px;cursor: pointer;"></i></i></td>
                <td th:unless='${hub.getIot_model().toUpperCase().contains("PROTOCOL")}' style="text-align: center;">-</td>

                <td th:if='${hub.getIot_model().toUpperCase().contains("CAM")}' style="text-align: center;"><a th:href="@{/Admin/Panel/GetTimeLaps/}+${hub.getId()}"><i class="mdi mdi-message-video" style="font-size: 20px;color:color:var(--primary);cursor: pointer;"></i></a></td>
                <td th:unless='${hub.getIot_model().toUpperCase().contains("CAM")}' style="text-align: center;">-</td>


                <td th:if='${hub.getIot_model().toUpperCase().contains("CAM")}' style="text-align: center;"><a th:href="@{/Admin/Panel/GetVideo/}+${hub.getId()}"><i class="mdi mdi-filmstrip" style="font-size: 20px;color:color:var(--primary);cursor: pointer;"></i></a></td>
                <td th:unless='${hub.getIot_model().toUpperCase().contains("CAM")}' style="text-align: center;">-</td>


                <td style="text-align: center;"><i th:onclick="Open_Link_Dialog(this, window.location.protocol + '//' + window.location.host + '/Admin/Panel/Hub/[[${hub.getId()}]]')"><i class="mdi mdi-table-edit" style="font-size: 20px;cursor: pointer;"></i></i></td>
              </tr>

              </tbody>
            </table>

            <div th:unless="${hubs.size>0}">
              <div style="margin-top:60px;">
                <img th:src="@{/Assets/Admin/images/icons/empty.png}" style="display:block;margin:0 auto;" width="150px">
                <p style="width:100%;text-align:center;color:#666;margin-top:20px;" th:text="#{label.nothing_found}"/>
              </div>
            </div>

          </div>
        </div>
      </div>
      <!--Content End-->

    </div>

  </div>
  <!-- content-wrapper ends -->


<ftr class="insert" th:insert="@{Admin/Components/panel_footer}" />
