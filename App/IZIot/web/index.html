  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #ffffff;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }

    #loading.hide {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid #f0f0f0;
      border-top-color: #61a896;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>

<body>

<div id="loading">
  <div class="spinner"></div>
</div>


<script src="flutter_bootstrap.js" async></script>


<script>
  window.addEventListener('flutter-first-frame', function () {

    var loading = document.getElementById('loading');

    if (loading) {

      loading.classList.add('hide');

      setTimeout(function () {
        loading.remove();
      }, 300);

    }

  });
</script>


</body>
