  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <!-- Primary SEO meta tags -->
  <title>BzHub - Digital Business Cards & Networking</title>
  <meta name="description" content="BzHub is a multilingual business networking platform. Create your digital business card, connect, and grow your network.">

  <!-- Open Graph / Facebook / LinkedIn -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://izior.ir/">
  <meta property="og:title" content="BzHub - Digital Business Cards & Networking">
  <meta property="og:description" content="Create your digital business card, connect, and grow your network with BzHub.">
  <meta property="og:image" content="https://izior.ir/icons/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:site_name" content="BzHub">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://izior.ir/">
  <meta name="twitter:title" content="BzHub - Digital Business Cards & Networking">
  <meta name="twitter:description" content="Create your digital business card, connect, and grow your network with BzHub.">
  <meta name="twitter:image" content="https://izior.ir/icons/og-image.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #ffffff;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      z-index: 9999;
      transition: opacity 0.3s ease;
    }
    #loading.hide {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 5px solid #f0f0f0;
      border-top-color: #D7561C;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
<div id="loading">
  <div class="spinner"></div>
</div>

<!--
  You can customize the "flutter_bootstrap.js" script.
  This is useful to provide a custom configuration to the Flutter loader
  or to give the user feedback during the initialization process.

  For more details:
  * https://docs.flutter.dev/platform-integration/web/initialization
-->
<script src="flutter_bootstrap.js" async></script>

<script>
  window.addEventListener('flutter-first-frame', function () {
    var loading = document.getElementById('loading');
    if (loading) {
      loading.classList.add('hide');
      setTimeout(function () { loading.remove(); }, 300);
    }
  });
</script>
</body>
</html>
